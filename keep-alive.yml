name: Supabase Keep-Alive

# Ejecuta un ping a Supabase cada 3 días para evitar que el proyecto
# gratuito sea pausado por inactividad (Supabase pausa tras 7 días sin tráfico).
# También se puede disparar manualmente desde Actions → Run workflow.

on:
  schedule:
    - cron: '0 8 */3 * *'   # cada 3 días a las 08:00 UTC
  workflow_dispatch:         # disparo manual desde GitHub

jobs:
  ping:
    name: Ping Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping al endpoint REST de Supabase
        env:
          SUPA_URL: ${{ secrets.SUPA_URL }}       # https://xxxx.supabase.co
          SUPA_KEY: ${{ secrets.SUPA_ANON_KEY }}  # clave anon pública
        run: |
          echo "Haciendo ping a Supabase..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${SUPA_URL}/rest/v1/" \
            -H "apikey: ${SUPA_KEY}" \
            -H "Authorization: Bearer ${SUPA_KEY}")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 500 ]; then
            echo "Error: respuesta inesperada del servidor ($STATUS)"
            exit 1
          fi
          echo "Ping exitoso."
